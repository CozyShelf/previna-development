services:
  backend:
    environment: {} # PUT COMMON BACKEND ENV VARIABLES HERE
    networks:
      - previna-network

  frontend:
    environment: {} # PUT COMMON FRONTEND ENV VARIABLES HERE
    networks:
      - previna-network

  nginx:
    image: nginx:1.27-alpine
    # Sem ports aqui: o Compose soma as listas de portas dos arquivos, então cada ambiente publica as suas
    # (dev: 80, ou NGINX_PORT do .env, no override; prod: 80 e 443 no docker-compose.prod.yml)
    depends_on:
      - backend
      - frontend
    networks:
      - previna-network

networks:
  previna-network:
    driver: bridge
