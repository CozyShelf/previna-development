services:
  backend:
    build:
      context: ../previna-backend
      dockerfile: ../previna-development/config/backend/Dockerfile.dev
    volumes:
      - ../previna-backend:/app
      - ~/.m2:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/previna
      - DB_USER=previna
      - DB_PASSWORD=previna
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=previna
      - POSTGRES_PASSWORD=previna
      - POSTGRES_DB=previna
    volumes:
      - previna-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U previna -d previna"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - previna-network

  frontend:
    build:
      context: ../previna-frontend
      dockerfile: ../previna-development/config/frontend/Dockerfile.dev
    volumes:
      - ../previna-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/backend

  mobile:
    build:
      context: ../previna-frontend-mobile
      dockerfile: ../previna-development/config/mobile/Dockerfile.dev
    volumes:
      - ../previna-frontend-mobile:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${MOBILE_HOST:-localhost}
      - EXPO_PUBLIC_API_URL=${MOBILE_API_URL:-http://localhost/backend}
    stdin_open: true
    tty: true
    depends_on:
      - nginx
    networks:
      - previna-network

  nginx:
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  devhub:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      # IP da maquina na LAN (mesmo do Metro), usado no QR code do Expo Go
      - MOBILE_HOST=${MOBILE_HOST:-}
    volumes:
      - ./config/devhub:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Só localhost: com acesso ao socket do Docker, a central controla a máquina
      - "127.0.0.1:9000:9000"

volumes:
  previna-db-data:
