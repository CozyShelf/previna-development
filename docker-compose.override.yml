services:
  backend:
    build:
      context: ../previna-backend
      dockerfile: ../previna-development/config/backend/Dockerfile.dev
    volumes:
      - ../previna-backend:/app
      - ~/.m2:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  frontend:
    build:
      context: ../previna-frontend
      dockerfile: ../previna-development/config/frontend/Dockerfile.dev
    volumes:
      - ../previna-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/backend

  nginx:
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
